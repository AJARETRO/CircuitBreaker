plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "8.3.0"
    id("io.papermc.hangar-publish-plugin") version "0.1.4"
}

group = 'dev.ajaretro'
version = '2.5-Vanguard'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // <-- The fix is here! Changed 1.21.10 to 1.21.1
    compileOnly("io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT")
    compileOnly("io.netty:netty-all:4.1.97.Final")
    implementation("org.bstats:bstats-bukkit:3.0.2")
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
shadowJar {
    relocate 'org.bstats', 'dev.ajaretro.circuitBreaker.bstats'
    archiveClassifier.set('')
    archiveFileName = "${project.name}-v${project.version.replace('-SNAPSHOT', '')}.jar"
}
jar {
    enabled = false
}
build.dependsOn(shadowJar)

hangarPublish {
    publications {
        register("plugin") {
            id.set("CircuitBreaker")
            apiKey.set("38df77b6-f7be-4aab-bb9b-1afbf620ce5b.16fc2981-9c0f-4dc6-b66d-653343378984")
            version.set(project.version)
            channel.set("Release")
            changelog.set("""Async Event Gate and Isolation Sentinel Release v2.4-Aegis

- **Chunk Frozen Chat Announcement:** All players inside a frozen chunk area receive a warning message letting them know the chunk has been isolated.
- **Configurable Warning Message:** Define a custom warning message using `chunk-frozen-message` in `config.yml`.
- **All Rights Reserved License:** Transitioned under a custom All Rights Reserved Software License Agreement.

Legacy Features (v2.3):


- **In-Game GUI Control Panel (`/cb gui`):** A custom interactive chest GUI dashboard allowing admins to view server health, list/teleport/unfreeze frozen chunks, and manage whitelists.
- **Discord Webhook Alerts:** Sends rich, customizable embed alerts to your Discord channels when lag machines are neutralized.
- **Defused Events counter:** Tracks and reports the number of prevented lag physics loops to bStats and the GUI panel.""")
            platforms {
                paper {
                    jar.set(tasks.shadowJar.archiveFile)
                    platformVersions.set(List.of("1.21", "1.21.1"))
                }
            }
        }
    }
}